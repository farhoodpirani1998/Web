<!DOCTYPE html>
<html>
<head>
  <title>Performance Metrics</title>
</head>
<body>
  <h1>Loading metrics from localhost:4173...</h1>
  <iframe id="app" src="http://localhost:4173" style="width:100%; height:500px; border:1px solid #ccc;"></iframe>

  <script>
    const iframe = document.getElementById('app');

    setTimeout(() => {
      try {
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        const win = iframe.contentWindow;

        // Collect metrics
        const metrics = {
          navigationTiming: win.performance.timing ? {
            navigationStart: win.performance.timing.navigationStart,
            responseEnd: win.performance.timing.responseEnd,
            domInteractive: win.performance.timing.domInteractive,
            domComplete: win.performance.timing.domComplete,
            loadEventEnd: win.performance.timing.loadEventEnd
          } : null,

          paintTiming: win.performance.getEntriesByType('paint').map(p => ({
            name: p.name,
            time: Math.round(p.startTime)
          })),

          lcpData: [],
          clsData: [],
          fcpData: null
        };

        // Collect LCP
        const lcpObserver = new win.PerformanceObserver((list) => {
          const entries = list.getEntries();
          entries.forEach(entry => {
            metrics.lcpData.push({
              startTime: Math.round(entry.startTime),
              renderTime: Math.round(entry.renderTime),
              loadTime: Math.round(entry.loadTime),
              element: entry.element?.tagName,
              size: entry.size
            });
          });
        });
        lcpObserver.observe({ type: 'largest-contentful-paint', buffered: true });

        // Collect CLS
        const clsObserver = new win.PerformanceObserver((list) => {
          list.getEntries().forEach(entry => {
            if (!entry.hadRecentInput) {
              metrics.clsData.push({
                time: Math.round(entry.startTime),
                value: entry.value.toFixed(4),
                sources: entry.sources?.map(s => ({
                  node: s.node?.tagName,
                  id: s.node?.id,
                  className: s.node?.className
                })) || []
              });
            }
          });
        });
        clsObserver.observe({ type: 'layout-shift', buffered: true });

        // Wait and output
        setTimeout(() => {
          console.log(JSON.stringify(metrics, null, 2));
          document.body.innerHTML = '<pre>' + JSON.stringify(metrics, null, 2) + '</pre>';
        }, 4000);

      } catch (e) {
        console.error('Error:', e.message);
        document.body.innerHTML = '<pre>Error: ' + e.message + '</pre>';
      }
    }, 2000);
  </script>
</body>
</html>
