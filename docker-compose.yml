services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME in root .env}
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER in root .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in root .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in root .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in root .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in root .env}
      DATABASE_SYNCHRONIZE: "false"
      SMS_JWT_PUBLIC_KEY_PATH: /run/secrets/sms-jwt-public-key.pem
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in root .env}
      TRUST_PROXY: "1"
      PUBLIC_SITE_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN in root .env}
      CMS_REFRESH_COOKIE_SECURE: "true"
      CMS_REFRESH_COOKIE_SAMESITE: lax
      HSTS_MAX_AGE_SECONDS: 31536000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOCAL_STORAGE_PATH: /app/uploads
    volumes:
      - backend-uploads:/app/uploads
      - ${SMS_JWT_PUBLIC_KEY_FILE:?Set SMS_JWT_PUBLIC_KEY_FILE in root .env}:/run/secrets/sms-jwt-public-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3100"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_API_BASE_URL: https://${API_DOMAIN:?Set API_DOMAIN in root .env}/public
    restart: unless-stopped
    expose:
      - "80"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_ADMIN_API_BASE_URL: https://${API_DOMAIN:?Set API_DOMAIN in root .env}/admin
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in root .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in root .env}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in root .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - admin
      - backend

volumes:
  postgres-data:
  redis-data:
  backend-uploads:
  caddy-data:
  caddy-config:
